asivo contingente y los acuerdos de pago protegiendo las arcas municipales.`,icon:`📜`,category:`special`},{id:`planificador_2032`,name:`Maestro Fiscal 2032`,description:`Completaste el plan financiero garantizando superávit primario sostenible hasta 2030.`,icon:`👑`,category:`mastery`}],missions:[{id:`mision-1`,title:`Territorio, Historia y Comunidad`,subtitle:`El corazón del Macizo Colombiano y la cuenca del Río Patía`,description:`Conoce los orígenes del municipio desde 1879, sus 449 km², 11 corregimientos, 50 veredas y la riqueza de sus resguardos indígenas.`,icon:`🌋`,estimatedMinutes:8,badgeReward:`geografo_sotara`,requiredStarsToUnlock:0,slides:[{id:`m1-s1`,type:`intro`,title:`Bienvenido a Sotará: Territorio de Volcán y Tradición`,subtitle:`Misión 1 · Contexto y Antecedentes del Municipio`,content:`El Municipio de Sotará está en el centro del departamento del Cauca, en la cordillera central y cuenca del río Patía. Con 449 km², limita con Puracé al oriente, Timbío, Rosas y La Sierra al occidente, Popayán al norte y La Vega al sur.`,cards:[{title:`Fundación 1879`,text:`Toma vida legal como inspección en 1920 y es creado formalmente mediante la Ley 26 de 1935 y ordenanza 002 de 1936.`,icon:`🏛️`,tag:`Historia`},{title:`5 Resguardos Indígenas`,text:`Población campesina e indígena en Rioblanco, Paletará, El Peñón, Coconuco y Poblazón.`,icon:`🌾`,tag:`Comunidad`},{title:`Economía Productiva`,text:`Ganadería doble propósito, papa, café, plátano, mora, fresa y trucha en El Molino, Ullucos y San Roque.`,icon:`🥔`,tag:`Producción`}],presenterNotes:`Enfatizar la geografía montañosa de Sotará, el origen del nombre en el volcán Sotará y la alta proporción de población rural (13.510 habitantes rurales vs 569 en cabecera).`},{id:`m1-s2`,type:`stats`,title:`Demografía e Indicadores Sociales DANE`,subtitle:`Población estimada y Necesidades Básicas Insatisfechas`,content:`El Censo DANE proyecta 14.079 habitantes para el año 2020. La brecha entre el área rural y la cabecera municipal plantea el reto principal de la planeación fiscal.`,stats:[{label:`Población Total`,value:`14.079 hab.`,detail:`13.510 rural (96%) · 569 cabecera (4%)`,trend:`up`},{label:`NBI Rural`,value:`57,52%`,detail:`Por debajo del promedio departamental (61,59%)`,trend:`down`},{label:`NBI Cabecera`,value:`30,93%`,detail:`Necesidades Básicas Insatisfechas urbanas`,trend:`neutral`},{label:`Pobreza Monetaria`,value:`35,7%`,detail:`Pobreza extrema en 9,6% (798 hogares)`,trend:`down`}],cards:[{title:`Víctimas del Conflicto`,text:`819 habitantes registrados según la Unidad de Víctimas (población flotante atendida por el municipio).`,icon:`🕊️`},{title:`Red Unidos`,text:`811 familias beneficiarias de programas de superación de pobreza extrema identificadas.`,icon:`🤝`}]},{id:`m1-s3`,type:`interactive`,title:`Explorador Territorial de Sotará`,subtitle:`Inspecciona las zonas y divisiones político-administrativas`,interactiveType:`inspector`,interactiveData:{title:`Estructura Territorial`,items:[{label:`Corregimientos`,value:`11`,desc:`Centros zonales de articulación rural con la administración`},{label:`Veredas`,value:`50`,desc:`Comunidades productivas agropecuarias y piscícolas`},{label:`Cabecera Municipal`,value:`1 con 9 Barrios`,desc:`Población concentrada y sede de la alcaldía`},{label:`Juntas de Acción Comunal`,value:`50 JAC`,desc:`Organizaciones cívicas que participan en el presupuesto`}]}},{id:`m1-s4`,type:`game`,title:`Minijuego 1: Palabra Oculta Fiscal`,subtitle:`Descifra el concepto geográfico clave de Sotará antes de agotar tus vidas`,gameType:`word_cipher`,gameConfig:{word:`SOTARA`,clue:`Nombre del municipio y del volcán emblemático ubicado en la cordillera central`,difficulty:`easy`,allowedMistakes:5}},{id:`m1-s5`,type:`game`,title:`Minijuego 2: Vuelo sobre el Patía`,subtitle:`Pilota el avión esquivando turbulencias y entra en la nube correcta`,gameType:`plane_navigator`,gameConfig:{question:`¿Cuántos habitantes residen en el área rural de Sotará según la proyección DANE 2020?`,options:[{text:`13.510 habitantes`,correct:!0},{text:`5.200 habitantes`,correct:!1},{text:`22.400 habitantes`,correct:!1},{text:`569 habitantes`,correct:!1}],speed:2.2}},{id:`m1-s6`,type:`quiz`,title:`Evaluación Rápida: Contexto de Sotará`,quiz:{question:`¿Cuál de los siguientes NO es uno de los cinco resguardos indígenas con presencia en Sotará?`,options:[`Rioblanco`,`Paletará`,`Guambía`,`Coconuco`],correctIndex:2,explanation:`Los 5 resguardos con población en Sotará son Rioblanco, Paletará, El Peñón, Coconuco y Poblazón. Guambía pertenece al municipio de Silvia.`,points:150}},{id:`m1-s7`,type:`reward`,title:`¡Misión 1 Completada con Éxito!`,subtitle:`Has dominado el contexto socio-demográfico y territorial`,reward:{coins:120,xp:250,badgeId:`geografo_sotara`,message:`Obtuviste la insignia "Guardián del Macizo". ¡Ahora tienes las bases para sumergirte en el análisis de ingresos del municipio!`}}]},{id:`mision-2`,title:`Estructura de Ingresos y Dependencia Fiscal`,subtitle:`Diagnóstico financiero de la vigencia 2016 a 2020`,description:`Descubre por qué las transferencias representan el 94,76% del presupuesto y analiza el recaudo de tributos como el Predial e Industria y Comercio.`,icon:`💰`,estimatedMinutes:10,badgeReward:`maestro_tributario`,requiredStarsToUnlock:1,slides:[{id:`m2-s1`,type:`intro`,title:`Radiografía de los Ingresos Municipales`,subtitle:`Presupuesto de $23.510 Millones y Recaudo Real 2020`,content:`En la vigencia 2020, Sotará presupuestó ingresos por $23.510 millones y recaudó $22.504 millones (cumplimiento del 95,72%). El análisis histórico revela una fuerte dependencia de transferencias de la Nación.`,cards:[{title:`Transferencias 94,76%`,text:`La gran mayoría del recaudo proviene del Sistema General de Participaciones (SGP). Margen de maniobra propio estrecho.`,icon:`🏛️`,tag:`Dependencia`},{title:`Recursos Propios: $292M`,text:`Impuestos tributarios sumaron $332 millones, con Predial ($292M) e Industria y Comercio ($34,6M) a la cabeza.`,ico
